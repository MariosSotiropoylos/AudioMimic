<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Sound Mimic 🎤</title>

    <style>
     /* GENERAL */ 
        * {box-sizing: border-box;}

        body {margin: 0; padding: 20px; min-height: 100vh;
		      font-family: Arial, sans-serif;
              color: white; background: linear-gradient(135deg, #111827, #1e293b, #312e81);
			  display: flex; justify-content: center; align-items: center;}

        .game {width: 100%; max-width: 900px;}


     /* HEADER */
        header {text-align: center; margin-bottom: 30px;}

        h1 {margin: 0; font-size: 42px; letter-spacing: 1px;}

        .subtitle {margin-top: 10px; opacity: 0.75; font-size: 17px;}


        /* MAIN PANEL */
        .panel {background:rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
                padding: 35px; text-align: center; backdrop-filter: blur(12px); box-shadow: 0 20px 50px rgba(0,0,0,0.25);}

        .panel h2 { margin-top: 0; font-size: 30px;}

        .mode-description {opacity: 0.75; margin-bottom: 30px;}


     /* GAME MODE BUTTONS */
        .mode-buttons {display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px;
                       max-width: 700px; margin: 0 auto;}

        .mode-button {min-height: 230px; margin: 0; padding: 30px;
                      color: white; border: 2px solid transparent; border-radius: 20px; cursor: pointer;
					  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
					  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;}

        .mode-button:hover {transform: translateY(-5px);}

        .mode-button:active {transform: translateY(0);}


    /* MODE ICON */
        .mode-icon {font-size: 60px; line-height: 1; margin-bottom: 10px;}


    /* MODE TITLE */
        .mode-title {font-size: 25px; font-weight: bold;}


   /* MODE DESCRIPTION */
        .mode-description-small {font-size: 15px; opacity: 0.7;}


   /* VERSUS MODE */
        .multiplayer-button {background:rgba(168,85,247,0.12); border-color:rgba(168,85,247,0.45);}

        .multiplayer-button:hover {background:rgba(168,85,247,0.20); border-color: #a855f7; 
		                           box-shadow:0 0 25px rgba(168,85,247,0.25);}



   /* SINGLE PLAYER MODE */
        .singleplayer-button {background:rgba(245,158,11,0.12); border-color:rgba(245,158,11,0.45);}

        .singleplayer-button:hover {background:rgba(245,158,11,0.20); border-color:#f59e0b;
		                            box-shadow:0 0 25px rgba(245,158,11,0.25);}



  /* ================================================
                   RESPONSIVE
     ================================================ */
        @media (max-width: 650px) 
		{

            h1 {font-size: 32px;}

            .panel {padding: 20px;}

            .mode-buttons {grid-template-columns: 1fr;}

            .mode-button {min-height: 180px;}

            .mode-icon {font-size: 50px;}
        }
    </style>
</head>

<body>
<div class="game">
   <!-- HEADER -->
    <header>
        <h1> 🎤 Sound Mimic 🎤 </h1>
        <div class="subtitle"> Choose the mode you want to play! </div>
    </header>



   <!-- GAME MODE SELECTION -->
    <div class="panel">
        <h2> Choose Game Mode </h2>

        <div class="mode-description"> Can you make the perfect sound? </div>

        <div class="mode-buttons">
           <!-- VERSUS MODE -->
            <button class="mode-button multiplayer-button" type="button" onclick="window.location.href='./Versus.html'">
                <div class="mode-icon"> 👥 </div>
                <div class="mode-title"> Versus Mode </div>
                <div class="mode-description-small"> 
				 Challenge a friend! Take turns making and imitating sounds. Who of you can reproduce the sound better?
				</div>
            </button>

           <!-- SINGLE PLAYER MODE -->
            <button class="mode-button singleplayer-button" type="button" onclick="window.location.href='SinglePlayer.html'">
                <div class="mode-icon"> 👤 </div>
                <div class="mode-title"> Single Player Mode </div>
                <div class="mode-description-small"> 
				 Put your listening skills to the test! Listen to different sounds and try to imitate them as accurately as you can.
				</div>
            </button>
        </div>
    </div>
</div>
</body>
</html>
